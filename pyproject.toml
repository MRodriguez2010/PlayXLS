[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "playxls"
version = "0.1.0"
description = "Native multi-stream video player for Ubuntu Linux."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "tomli-w>=1.0.0",
]

[project.optional-dependencies]
gui = [
  "PySide6>=6.7",
]
watch = [
  "watchdog>=4.0",
]
streams = [
  "streamlink>=6.0",
  "yt-dlp>=2025.1.0",
]
test = [
  "pytest>=8.0",
]
dev = [
  "pytest>=8.0",
  "tomli-w>=1.0.0",
  "streamlink>=6.0",
  "yt-dlp>=2025.1.0",
]

[project.scripts]
playxls = "playxls.app:main"

[tool.setuptools.packages.find]
include = ["playxls*"]
